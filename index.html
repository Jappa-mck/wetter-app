<!DOCTYPE html>
<html lang="de">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wetter App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>

</head>
  <body>

    <main>

      <h1>Wetter App</h1>

      <form id="weather-form">

        <label for="city-input">Suche nach einer Stadt und lasse dir das Wetter anzeigen</label>

        <div class="search-box">
          <input type="text" id="city-input" autocomplete="off" placeholder="z. B. Berlin" required>
          <button type="submit" aria-label="Wetter anzeigen">
            <img src="icons/search.svg" alt="" width="20" height="20">
          </button>
        </div>

      </form>

      <section class="weather-card"> 

        <div id="weather-result" aria-live="polite"></div>
        <div id="weather-details" hidden>

          <h2>
            <span id="city-name"></span>
            <span id="country-name"></span>
          </h2>

          <div class="weather-grid">

            <div class="weather-item">
              <span class="weather-label">Temperatur</span>

              <div class="weather-main">
                <img class="weather-icon" src="icons/sun.svg" alt="">
                <span class="weather-value" id="temperature-value"></span>
              </div>
              
            </div>


            <div class="weather-item">
              <span class="weather-label">Gefühlte Temperatur</span>
              
              <div class="weather-main">
                <img class="weather-icon" src="icons/thermometer.svg" alt="">
                <span class="weather-value" id="apparent-temperature-value"></span>
              </div>

            </div>


            <div class="weather-item">
              <span class="weather-label">Höchst-/Tiefstwert</span>

              <div class="weather-main">
                <img class="weather-icon" src="icons/arrow-up-down.svg" alt="">
                <span class="weather-value" id="temperature-range-value"></span>
              </div>

            </div>


            <div class="weather-item">
              <span class="weather-label">Regenwahrscheinlichkeit</span>

              <div class="weather-main">
                <img class="weather-icon" src="icons/cloud-rain.svg" alt="">
                <span class="weather-value" id="precipitation-probability-value"></span>
              </div>

            </div>
          
          </div>

        </div>  

      </section>

    </main>

  </body>
</html>
